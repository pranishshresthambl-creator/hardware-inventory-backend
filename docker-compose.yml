services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hardware_inventory_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ../Hardware-Inventory-System-
      dockerfile: Dockerfile
    container_name: hardware_inventory_frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ../Hardware-Inventory-System-:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend