services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nrb_hardware_backend
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/venv
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ../Hardware-Inventory-System-
      dockerfile: Dockerfile
    container_name: nrb_hardware_frontend
    restart: unless-stopped
    volumes:
      - ../Hardware-Inventory-System-:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend